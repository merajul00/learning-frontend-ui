<section class="login">
  <div class="login__card">
    <a routerLink="/" class="login__brand">NihongoBD</a>

    <div class="login__tabs">
      <button
        type="button"
        class="login__tab"
        [class.login__tab--active]="mode() === 'login'"
        (click)="setMode('login')"
      >
        Log In
      </button>
      <button
        type="button"
        class="login__tab"
        [class.login__tab--active]="mode() === 'register'"
        (click)="setMode('register')"
      >
        Create Account
      </button>
    </div>

    <form class="login__form" (ngSubmit)="submit()" #form="ngForm">
      @if (mode() === 'register') {
        <label class="login__field">
          <span>Name</span>
          <input name="displayName" type="text" [(ngModel)]="displayName" autocomplete="name" />
        </label>
      }

      <label class="login__field">
        <span>Email address</span>
        <input
          name="email"
          type="email"
          required
          [(ngModel)]="email"
          autocomplete="email"
        />
      </label>

      <label class="login__field">
        <span>Password</span>
        <input
          name="password"
          type="password"
          required
          minlength="6"
          [(ngModel)]="password"
          autocomplete="current-password"
        />
      </label>

      @if (mode() === 'login') {
        <div class="login__row">
          <label class="login__checkbox">
            <input name="rememberMe" type="checkbox" [(ngModel)]="rememberMe" />
            <span>Remember me</span>
          </label>

          <button type="button" class="login__link" (click)="forgotPassword()">
            Forgot password?
          </button>
        </div>
      }

      @if (errorMessage()) {
        <p class="login__error" role="alert">{{ errorMessage() }}</p>
      }

      @if (infoMessage()) {
        <p class="login__info" role="status">{{ infoMessage() }}</p>
      }

      <button type="submit" class="login__submit" [disabled]="submitting() || form.invalid">
        {{ mode() === 'login' ? 'Log In' : 'Create Account' }}
      </button>
    </form>

    <div class="login__divider"><span>or</span></div>

    <button
      type="button"
      class="login__google"
      [disabled]="submitting()"
      (click)="continueWithGoogle()"
    >
      <svg viewBox="0 0 48 48" width="18" height="18" aria-hidden="true">
        <path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z" />
        <path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z" />
        <path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z" />
        <path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z" />
      </svg>
      <span>Continue with Google</span>
    </button>
  </div>
</section>
