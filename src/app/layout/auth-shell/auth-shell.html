<div class="auth-shell">
  <aside class="auth-shell__sidebar">
    <a routerLink="/dashboard" class="auth-shell__brand">NihongoBD</a>

    <nav class="auth-shell__nav">
      @for (link of navLinks; track link.path) {
        <a
          [routerLink]="link.path"
          routerLinkActive="auth-shell__nav-link--active"
          class="auth-shell__nav-link"
        >
          {{ link.label }}
        </a>
      }
    </nav>

    <button type="button" class="auth-shell__signout" (click)="signOut()">Sign Out</button>
  </aside>

  <main class="auth-shell__content">
    <header class="auth-shell__topbar">
      <button type="button" class="auth-shell__notification" aria-label="Notifications">
        <img src="images/header/notification-icon.svg" alt="" class="auth-shell__notification-icon" />
      </button>

      <a routerLink="/profile" class="auth-shell__profile" aria-label="Go to your profile">
        <span class="auth-shell__avatar">{{ initials }}</span>
        <span class="auth-shell__profile-name">{{ displayName }}</span>
      </a>
    </header>

    <router-outlet />
  </main>
</div>
